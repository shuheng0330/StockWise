[project]
name = "stockwise-backend"
version = "0.1.0"
description = "StockWise backend services for UMHackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "pandas>=2.3.0",
    "pydantic>=2.13.1",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
